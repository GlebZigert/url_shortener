syntax = "proto3";

package url_shortener;

option go_package = "url_shortener/proto";


message CreateShortURLRequest {
  string origin = 1;
}

message CreateShortURLResponse {
  string short = 1;
  string error = 2;
}

message GetURLRequest {
  string short = 1;
}

message GetURLResponse {
  string origin = 1;
  string error = 2;
}

message BatcherRequest {

    message Nested {
        string correlation_id = 1;
        string original_url = 2;
    }

    repeated Nested items = 1;
}

message BatcherResponce {

    message Nested {
        string correlation_id = 1;
        string short_url = 2;
    }

    repeated Nested items = 1;
}

message GetURLsRequest {

}

message GetURLsResponce {

   message Nested {
        string short = 1;
        string origin = 2;
    }

    repeated Nested items = 1;
}



service UrlShortener {
  rpc CreateShortURL(CreateShortURLRequest) returns (CreateShortURLResponse);
  rpc GetURL(GetURLRequest) returns (GetURLResponse);
  rpc Batcher(BatcherRequest) returns(BatcherResponce);
  rpc GetURLs(GetURLsRequest) returns(GetURLsResponce);
}